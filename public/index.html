<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>WorkFuel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1322;--surface:#121c2e;--surface2:#18243a;--line:#24324b;
  --text:#e9eef7;--muted:#8d9bb2;--blue:#3b82f6;--blue-soft:rgba(59,130,246,.16);
  --green:#22c55e;--green-soft:rgba(34,197,94,.14);--orange:#f5a524;--orange-soft:rgba(245,165,36,.15);
  --red:#ef4444;--red-soft:rgba(239,68,68,.14);--on-accent:#fff;--shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef2f8;--surface:#ffffff;--surface2:#f3f6fb;--line:#dbe2ec;
    --text:#0f1b2d;--muted:#5b6b82;--blue:#2563eb;--blue-soft:rgba(37,99,235,.1);
    --green:#16a34a;--green-soft:rgba(22,163,74,.1);--orange:#d97706;--orange-soft:rgba(217,119,6,.12);
    --red:#dc2626;--red-soft:rgba(220,38,38,.1);--shadow:0 8px 24px rgba(15,27,45,.1);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef2f8;--surface:#ffffff;--surface2:#f3f6fb;--line:#dbe2ec;
  --text:#0f1b2d;--muted:#5b6b82;--blue:#2563eb;--blue-soft:rgba(37,99,235,.1);
  --green:#16a34a;--green-soft:rgba(22,163,74,.1);--orange:#d97706;--orange-soft:rgba(217,119,6,.12);
  --red:#dc2626;--red-soft:rgba(220,38,38,.1);--shadow:0 8px 24px rgba(15,27,45,.1);color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
body.no-nav .app{padding-bottom:32px}
body.no-nav nav.tabs{display:none}
.screen{display:none}
.screen.active{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.active{animation:none}}

/* header */
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.brand > svg{width:48px;height:32px;flex:none}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.mpick{border:0;background:transparent;padding:0;text-align:left;min-width:0;flex:1}
.mpick p{margin:0;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.mpick p span{overflow:hidden;text-overflow:ellipsis}
.mpick p svg{width:14px;height:14px;flex:none}
.topbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:0 0 16px}
.topbar h2{margin:0;text-align:center;font-size:18px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--text);flex:none}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px}
body.tg .topbar .icon-btn[data-go]{visibility:hidden}

/* hero */
.hero{border-radius:20px;overflow:hidden;position:relative;background:var(--surface);box-shadow:var(--shadow)}
.hero svg{display:block;width:100%;height:auto}
.hero .hero-title{position:absolute;left:16px;bottom:12px;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:-6px;position:relative}
.stat{padding:14px 8px;text-align:center;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat svg{width:24px;height:24px;margin-bottom:6px}
.stat small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:4px}
.stat b{font-size:16px;font-weight:800;white-space:nowrap}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:16px;margin-top:12px}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--blue);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface2);border:1px solid var(--line)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-green{background:var(--green);color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row .btn{margin-top:12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.card-label{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:12px}
.card-hint{color:var(--muted);font-size:13px;margin:10px 2px 0;line-height:1.45}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.dot svg{width:16px;height:16px}
.dot.green{background:var(--green);color:#fff}.dot.red{background:var(--red);color:#fff}.dot.blue{background:var(--blue);color:#fff}.dot.orange{background:var(--orange);color:#fff}
.field{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.field input{flex:1;min-width:0;border:0;background:transparent;font-size:30px;font-weight:700;padding:10px 0;outline:none;letter-spacing:.02em}
.field input[type=date]{font-size:18px}
.field.md input{font-size:24px}
.field.sm input{font-size:18px;font-weight:600;letter-spacing:0}
.field input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.field span{color:var(--muted);font-weight:600;white-space:nowrap}
.field:focus-within{border-color:var(--blue)}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:1em}
.intro{display:flex;gap:14px;align-items:center;background:var(--blue-soft);border:1px solid var(--blue);border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.5}
.intro > svg{width:64px;height:42px;flex:none}

/* timer */
.timer{display:flex;align-items:center;gap:14px;background:var(--green-soft);border:1px solid var(--green);border-radius:18px;padding:14px 16px;margin-top:12px}
.timer .pulse{width:12px;height:12px;border-radius:50%;background:var(--green);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 12px rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.timer .pulse{animation:none}}
.timer.paused{background:var(--orange-soft);border-color:var(--orange)}
.timer.paused .pulse{background:var(--orange);animation:none}
.timer b{font-size:26px;font-variant-numeric:tabular-nums;display:block}
.timer .brk{display:block;color:var(--orange);font-size:12.5px;font-weight:600;margin-top:2px}
.timer small{color:var(--muted)}

.alert{display:flex;gap:12px;align-items:center;background:var(--orange-soft);border:1px solid var(--orange);color:var(--text);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px}
.alert svg{width:22px;height:22px;color:var(--orange);flex:none}

/* result */
.success{display:flex;gap:14px;align-items:center;background:var(--green-soft);border:1px solid var(--green);border-radius:18px;padding:18px}
.success .check{width:48px;height:48px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;flex:none}
.success h3{margin:0 0 4px;font-size:20px}
.success p{margin:0;color:var(--muted);font-size:13.5px}
.rows .row{display:flex;align-items:center;gap:12px;padding:14px 0}
.rows .row+.row{border-top:1px solid var(--line)}
.rows .row svg{width:26px;height:26px;color:var(--blue);flex:none}
.rows .row .lbl{flex:1;color:var(--muted)}
.rows .row .val{text-align:right;font-weight:800;font-size:17px}
.rows .row .val small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.note{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.5}
.note svg{width:30px;height:30px;color:var(--blue);flex:none}
.note b{color:var(--text)}

/* history */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:0;background:var(--surface2);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--blue);color:var(--on-accent)}
.totals{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:14px 2px 2px}
.totals b{color:var(--text)}
.item{display:flex;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.item .main{flex:1}
.item .d{font-weight:700;margin-bottom:8px}
.item .d span{color:var(--muted);font-weight:500;margin-left:8px}
.item .m{display:flex;gap:22px;font-size:14.5px;font-weight:600}
.item .m span{display:flex;align-items:center;gap:6px}
.item .m svg{width:18px;height:18px}
.item > svg{width:18px;height:18px;color:var(--muted)}
.c-green{color:var(--green)}.c-blue{color:var(--blue)}.c-orange{color:var(--orange)}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty p{margin:0 0 6px}
.empty .btn{max-width:260px;margin:14px auto 0}

/* tank */
.tank-wrap{display:flex;gap:18px;align-items:center}
.tank{width:92px;height:150px;border:3px solid var(--line);border-radius:18px;position:relative;overflow:hidden;background:var(--bg);flex:none}
.tank .fuel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--blue),#1d4ed8);transition:height .6s ease}
.tank .fuel.low{background:linear-gradient(180deg,var(--orange),#b45309)}
.tank .ticks{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 36px,var(--line) 36px 37px);opacity:.6}
.tank-info .big{font-size:40px;font-weight:800;line-height:1}
.tank-info .big small{font-size:18px;color:var(--muted);font-weight:600}
.tank-info p{margin:8px 0 0;color:var(--muted);font-size:14px}
.tank-info p b{color:var(--text)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.section-title{font-weight:700;margin:22px 2px 2px;font-size:16px}
.fill-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px}
.fill-item+.fill-item{border-top:1px solid var(--line)}
.fill-item small{color:var(--muted);display:block;font-size:12.5px}
.fill-item .x{border:0;background:transparent;color:var(--muted);padding:6px}

/* settings */
.set-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:14px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row > svg:first-child{width:24px;height:24px;color:var(--blue);flex:none}
.set-row .t{flex:1;min-width:0}
.set-row .t b{display:block;font-weight:600}
.set-row .t small{color:var(--muted)}
.set-row > svg:last-child:not(:first-child){width:18px;height:18px;color:var(--muted);flex:none}
.set-row .badge{font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:3px 8px;margin-left:6px}
.card.list{padding:2px 16px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--blue)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10}
.backdrop.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet .in{max-width:480px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-bottom:0;max-height:85vh;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:18px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;z-index:20;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}

/* gate / loading */
.gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.gate > svg{width:120px;height:80px}
.gate p{margin:0;color:var(--muted);line-height:1.5;max-width:300px}
.gate .btn{max-width:260px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<div class="app">

    if (minutes < 1) return err('errBreak');
    const data = { date, start, end, breakMin, minutes, norm, liters: minutes/60*norm };
    let s;
    if (editingId) { s = S.sessions.find(x => x.id === editingId); Object.assign(s, data); }
    else { s = Object.assign({ id: uid(), machineId: M().id }, data); S.sessions.push(s); }
    save(); haptic('success'); showResult(s);
  };

  // ---------- result ----------
  let lastResult = null;
  function showResult(s){ lastResult = s; go('result'); }
  function renderResult(){
    const s = lastResult; if (!s) return;
    const m = mById(s.machineId) || M(), lvl = tankLevel(m);
    $('#r-rows').innerHTML = `
      <div class="row">${ico('i-clock')}<span class="lbl">${esc(t('workTime'))}</span><span class="val">${fmtDur(s.minutes)}<small>${esc(spanTxt(s))}</small></span></div>
      <div class="row">${ico('i-fuel')}<span class="lbl">${esc(t('fuelUse'))}</span><span class="val">${fmtL(s.liters)} ${t('liters')}<small>${t('byNorm', { n: s.norm })}</small></span></div>
      <div class="row">${ico('i-tank')}<span class="lbl">${esc(t('inTank'))}</span><span class="val">~${Math.round(lvl)} ${t('liters')}<small>${t('enoughFor', { d: fmtDur(lvl / m.norm * 60) })}</small></span></div>`;
    $('#r-note').innerHTML = `${ico('i-info')}<div>${t('resultNote', { n: s.norm, d: fmtDur(s.minutes), l: fmtL(s.liters) })}</div>`;
  }
  $('#r-again').onclick = () => openEntry();

  // ---------- history ----------
  let filter = 'all';
  $('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; filter = c.dataset.f; $$('#chips .chip').forEach(x => x.classList.toggle('on', x === c)); renderHistory(); });
  function renderHistory(){
    const list = sorted().filter(s => inRange(s, filter));
    const tot = sumFor(list);
    $('#hist-totals').innerHTML = list.length ? `<span>${esc(t('total'))}: <b>${fmtDur(tot.min)}</b></span><span><b>${fmtL(tot.l)} ${t('liters')}</b></span>` : '';
    if (!list.length) {
      $('#hist-list').innerHTML = `<div class="empty"><p>${esc(t('emptyPeriod'))}</p><p>${esc(t('emptyHint'))}</p>
        <button class="btn btn-primary" id="hist-add">${ico('i-plus')}${esc(t('addEntry'))}</button></div>`;
      $('#hist-add').onclick = () => openEntry();
      return;
    }
    $('#hist-list').innerHTML = list.map(s => `
      <button class="item" data-id="${s.id}"><span class="main">
        <div class="d">${fmtDate(s.date)}<span>${esc(spanTxt(s))}</span></div>
        <div class="m"><span><svg class="c-green"><use href="#i-clock"/></svg>${fmtDur(s.minutes)}</span><span><svg class="c-blue"><use href="#i-fuel"/></svg>${fmtL(s.liters)} ${t('liters')}</span></div>
      </span>${ico('i-next')}</button>`).join('');
    $$('#hist-list .item').forEach(b => b.onclick = () => openSession(b.dataset.id));
  }
  function openSession(id){
    const s = S.sessions.find(x => x.id === id); if (!s) return;
    openSheet(`<h3>${fmtDate(s.date)}</h3>
      <div class="rows">
        <div class="row">${ico('i-clock')}<span class="lbl">${esc(t('time'))}</span><span class="val">${s.start} – ${s.end}<small>${fmtDur(s.minutes)}${s.breakMin ? ' · ' + esc(t('breakShort', { d: fmtDur(s.breakMin) })) : ''}</small></span></div>
        <div class="row">${ico('i-fuel')}<span class="lbl">${esc(t('use'))}</span><span class="val">${fmtL(s.liters)} ${t('liters')}<small>${s.norm} ${t('lph')}</small></span></div>
      </div>
      <div class="btn-row"><button class="btn btn-danger" id="sh-del">${esc(t('del'))}</button><button class="btn btn-primary" id="sh-edit">${esc(t('edit'))}</button></div>`);
    $('#sh-edit').onclick = () => { closeSheet(); openEntry(id); };
    $('#sh-del').onclick = () => {
      if ($('#sh-del').dataset.sure) { S.sessions = S.sessions.filter(x => x.id !== id); save(); closeSheet(); toast(t('deleted')); render(); }
      else { $('#sh-del').dataset.sure = 1; $('#sh-del').textContent = t('confirm'); haptic('warning'); }
    };
  }

  // ---------- tank ----------
  function renderTank(){
    const m = M(); if (!m) return;
    const cap = m.cap, lvl = tankLevel(), pct = lvl/cap*100, low = pct <= m.low;
    const f = $('#t-fuel'); f.style.height = Math.max(0, Math.min(100, pct)) + '%'; f.classList.toggle('low', low);
    $('#t-liters').innerHTML = Math.round(lvl) + ' <small>/ ' + cap + ' ' + t('l') + '</small>';
    $('#t-pct').innerHTML = `<b style="color:${low ? 'var(--orange)' : 'var(--green)'}">${esc(t('pctFull', { p: Math.round(pct) }))}</b>`;
    $('#t-hours').innerHTML = t('approxHours', { d: fmtDur(lvl / m.norm * 60) });

    const mine = ofM(S.sessions);
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(ymd(d)); }
    const vals = days.map(d => sumFor(mine.filter(s => s.date === d)).l);
    const max = Math.max(10, ...vals), W = 340, top = 18, base = 140, bw = 30, gap = (W - 7*bw) / 8;
    let g = `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/>`;
    vals.forEach((v, i) => {
      const x = gap + i*(bw+gap), h = v / max * (base - top), y = base - h, d = days[i], isToday = d === today();
      g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, v ? 2 : 0)}" rx="6" fill="${isToday ? 'var(--blue)' : 'var(--blue-soft)'}" stroke="var(--blue)" stroke-opacity="${isToday ? 0 : .5}"/>`;
      if (v) g += `<text x="${x + bw/2}" y="${y - 5}" text-anchor="middle" style="fill:var(--text);font-weight:700">${Math.round(v)}</text>`;
      g += `<text x="${x + bw/2}" y="${base + 18}" text-anchor="middle">${d.slice(8)}.${d.slice(5,7)}</text>`;
    });
    $('#t-chart').innerHTML = g;

    const mm = sumFor(mine.filter(s => inRange(s, 'month')));
    const myFills = ofM(S.fills);
    const filled = myFills.filter(x => x.type === 'fill' && inRange({ date: ymd(new Date(x.at)) }, 'month')).reduce((a,x) => a + x.liters, 0);
    const workDays = new Set(mine.filter(s => inRange(s, 'month') && s.minutes > 0).map(s => s.date)).size;
    $('#t-month').innerHTML = `
      <div class="row">${ico('i-clock')}<span class="lbl">${esc(t('workedTime'))}</span><span class="val">${fmtDur(mm.min)}<small>${esc(t('workDays', { n: workDays }))}</small></span></div>
      <div class="row">${ico('i-fuel')}<span class="lbl">${esc(t('spentL'))}</span><span class="val">${fmtL(mm.l)} ${t('liters')}</span></div>
      <div class="row">${ico('i-drop')}<span class="lbl">${esc(t('filled'))}</span><span class="val">${fmtL(filled)} ${t('liters')}<small>${esc(t('fullNotCounted'))}</small></span></div>`;

    const fl = myFills.slice().sort((a,b) => b.at.localeCompare(a.at)).slice(0, 15);
    $('#t-fills').innerHTML = fl.length ? fl.map(x => {
      const d = new Date(x.at), label = x.type === 'full' ? t('fullTank') : x.type === 'set' ? t('exactAmt', { l: Math.round(x.liters) }) : `+${fmtL(x.liters)} ${t('liters')}`;
      return `<div class="fill-item"><div><b>${esc(label)}</b><small>${fmtDate(ymd(d))}, ${hhmm(d)}</small></div><button class="x" data-del="${x.id}" aria-label="${esc(t('del'))}">✕</button></div>`;
    }).join('') : `<div class="empty" style="padding:18px"><p>${esc(t('noFills'))}</p></div>`;
    $$('#t-fills [data-del]').forEach(b => b.onclick = () => { S.fills = S.fills.filter(x => x.id !== b.dataset.del); save(); toast(t('deleted')); renderTank(); });
  }
  $('#t-fill').onclick = () => {
    const m = M();
    askNumber({ title: t('howMuchFill'), value: '', unit: t('liters'),
      quick: [{ t: t('fullTank'), v: 'full' }, { t: '50', v: 50 }, { t: '100', v: 100 }, { t: '150', v: 150 }],
      onSave: v => {
        const at = new Date().toISOString();
        if (v === 'full') { S.fills.push({ id: uid(), machineId: m.id, at, type:'full', liters: 0 }); save(); haptic('success'); toast(t('tankFilled')); render(); return; }
        const n = num(v); if (!(n > 0)) return t('enterLiters');
        const before = tankLevel(m);
        S.fills.push({ id: uid(), machineId: m.id, at, type:'fill', liters: n }); save(); haptic('success');
        toast(before + n > m.cap ? t('overCap', { c: m.cap }) : t('added', { l: fmtL(n) }));
        render();
      }});
  };
  $('#t-set').onclick = () => {
    const m = M();
    askNumber({ title: t('exactQ'), value: Math.round(tankLevel(m)), unit: t('liters'),
      extra: `<p class="muted" style="font-size:13.5px;margin:10px 0 0">${esc(t('exactHint'))}</p>`,
      onSave: v => { const n = num(v); if (!(n >= 0) || n > m.cap) return t('range', { c: m.cap });
        S.fills.push({ id: uid(), machineId: m.id, at: new Date().toISOString(), type:'set', liters: n }); save(); toast(t('leftUpdated')); render(); }});
  };

  // ---------- profile ----------
  function renderProfile(){
    const a = M();
    $('#p-machines').innerHTML = S.machines.map(m => `
      <button class="set-row" data-medit="${m.id}">${ico('i-tank')}<span class="t"><b>${esc(m.name)}${a && m.id === a.id ? `<span class="badge">${esc(t('active'))}</span>` : ''}</b>
        <small>${esc(typeName(m.type))}${m.plate ? ' · ' + esc(m.plate) : ''} · ${esc(t('mSummary', { c: m.cap, n: m.norm }))}</small></span>${ico('i-next')}</button>`).join('') +
      `<button class="set-row" id="p-add">${ico('i-plus')}<span class="t"><b>${esc(t('newMachine'))}</b></span>${ico('i-next')}</button>`;
    $$('#p-machines [data-medit]').forEach(b => b.onclick = () => openMachine(b.dataset.medit));
    $('#p-add').onclick = () => openMachine();
    const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
    $('#p-name').textContent = [PROFILE.first_name || u.first_name, PROFILE.last_name || u.last_name].filter(Boolean).join(' ') || 'WorkFuel';
    $('#p-user').textContent = (PROFILE.username || u.username) ? '@' + (PROFILE.username || u.username) : '';
    $('#p-phone').textContent = PROFILE.phone || '—';
    $('#p-lang-v').textContent = LANG === 'ru' ? 'Русский' : "O'zbekcha";
  }
  $('#p-lang').onclick = () => {
    openSheet(`<h3>${esc(t('language'))}</h3><div class="card list" style="margin-top:0">
      <button class="set-row" data-lang="uz"><span class="t"><b>🇺🇿 O'zbekcha</b></span>${LANG === 'uz' ? ico('i-check') : ''}</button>
      <button class="set-row" data-lang="ru"><span class="t"><b>🇷🇺 Русский</b></span>${LANG === 'ru' ? ico('i-check') : ''}</button></div>`);
    $$('#sheet-body [data-lang]').forEach(b => b.onclick = () => {
      const l = b.dataset.lang; closeSheet(); if (l === LANG) return;
      LANG = l; PROFILE.lang = l; applyStatic(); render(); toast(t('langSaved'));
      api('PUT', '/api/lang', { lang: l }).catch(() => {});
    });
  };

  function render(){
    if (current === 'home') renderHome();
    if (current === 'history') renderHistory();
    if (current === 'tank') renderTank();
    if (current === 'profile') renderProfile();
    if (current === 'result') renderResult();
  }

  // ---------- boot ----------
  function gate(msgKey, btnKey, onBtn){
    $('#g-msg').textContent = t(msgKey);
    $('#g-btn').textContent = t(btnKey);
    $('#g-btn').onclick = onBtn;
    go('gate');
  }
  function normalize(s){
    const b = blank();
    if (!s || typeof s !== 'object') return b;
    return Object.assign(b, s, { machines: s.machines || [], sessions: s.sessions || [], fills: s.fills || [] });
  }
  async function boot(){
    const tu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    LANG = tu && /^ru/.test(tu.language_code || '') ? 'ru' : 'uz';
    applyStatic();
    go('loading');
    if (!inTg && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      return gate('gateNoTg', 'retry', () => location.reload());
    }
    if (tu) CACHE_KEY = 'workfuel.v2.' + tu.id;
    const cached = readCache();
    let data;
    try { data = await api('POST', '/api/me'); }
    catch(e) {
      if (e.status === 403) return gate('gateNoReg', 'close', () => tg ? tg.close() : location.reload());
      if (e.status === 401 || !cached) return gate('gateErr', 'retry', () => location.reload());
      data = null; // offline: fall back to the cached copy
    }
    if (data) {
      PROFILE = data.profile || {};
      if (PROFILE.lang) LANG = PROFILE.lang;
      S = normalize(cached && cached.pending ? cached.S : data.state);
      if (cached && cached.pending) { dirty = true; sync(); } else cache(false);
    } else {
      S = normalize(cached.S);
      toast(t('offline'));
    }
    applyStatic();
    if (!S.machines.length) openMachine(); else go('home');
  }
  boot();
})();
</script>
</body>
</html>
